services:
  # Backend FastAPI Service
  - type: web
    name: recover-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false # You will need to manually set this in the Render dashboard

  # Frontend Streamlit Service
  - type: web
    name: recover-frontend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: recover-backend
          property: url
